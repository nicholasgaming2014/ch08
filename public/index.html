<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ch08</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="banner">
    <button class="menu-button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
      <span></span><span></span><span></span>
    </button>
    <a href="/#home" class="logo" aria-label="ch08 home">
      <span>ch</span>
      <span>08</span>
    </a>
  </header>

  <div class="menu-overlay" hidden></div>
  <nav id="menu" class="menu" aria-label="Main menu">
    <a href="/#home" class="menu-link">home</a>
    <a href="/#beats" class="menu-link">beats</a>
    <a href="/#art" class="menu-link">art</a>
    <a href="/#fc" class="menu-link">fc/fifa</a>

    <a href="/#contact" class="menu-link">contact</a>
    <a href="/admin" class="menu-link">admin</a>
  </nav>

  <main>
    <section id="home" class="page">
      <div class="home">
        <p class="home-headline" hidden></p>
        <h1 class="home-big" hidden></h1>
        <img class="hero-gif" alt="" hidden>
        <p class="home-paragraph" hidden></p>
        <div class="link-list" hidden></div>
      </div>
    </section>

    <section id="beats" class="page" hidden>
      <div class="content-column">
        <h1 class="page-title">beats</h1>
        <div class="beats-toolbar" hidden>
          <label class="sort-control">
            <span>sort</span>
            <select id="beat-sort">
              <option value="newest">newest</option>
              <option value="oldest">oldest</option>
              <option value="title">title a–z</option>
              <option value="title-desc">title z–a</option>
              <option value="bpm">bpm low–high</option>
              <option value="bpm-desc">bpm high–low</option>
              <option value="length">length short–long</option>
              <option value="length-desc">length long–short</option>
            </select>
          </label>
          <div class="producer-pills" role="group" aria-label="Filter by producer"></div>
        </div>
        <div class="beat-list"></div>
        <p class="empty-note" hidden>no beats yet</p>
      </div>
    </section>

    <section id="art" class="page" hidden>
      <div class="art-column">
        <h1 class="page-title">art</h1>
        <div class="art-collage"></div>
        <p class="empty-note" hidden>no artwork yet</p>
      </div>
    </section>

    <section id="fc" class="page" hidden>
      <div class="fc-column">
        <h1 class="page-title">fc/fifa</h1>

        <section class="fc-block" aria-labelledby="fc-proclubs-title">
          <h2 id="fc-proclubs-title" class="fc-heading">pro clubs</h2>
          <div class="fc-filters" data-filter="game" role="group" aria-label="Pick a game"></div>
          <div class="fc-table" data-table="proClubs"></div>
        </section>

        <section class="fc-block" aria-labelledby="fc-career-title">
          <h2 id="fc-career-title" class="fc-heading">southampton career mode</h2>
          <div class="fc-filters" data-filter="season" role="group" aria-label="Pick a season"></div>
          <h3 class="fc-subheading">seasons</h3>
          <div class="fc-table" data-table="careerSeasons"></div>
          <h3 class="fc-subheading">players</h3>
          <div class="fc-table" data-table="careerPlayers"></div>
          <h3 class="fc-subheading">trophies</h3>
          <ul class="fc-trophies"></ul>
        </section>
      </div>
    </section>

    <section id="contact" class="page" hidden>
      <div class="content-column contact">
        <h1 class="page-title">contact</h1>

        <div class="panel contact-intro" hidden>
          <p class="contact-paragraph"></p>
        </div>

        <div class="panel-group contact-email-group" hidden>
          <h2 class="panel-label">email</h2>
          <div class="panel">
            <a class="panel-row contact-email">
              <span class="row-icon" style="--tile: #0a84ff" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              </span>
              <span class="row-text">
                <span class="row-title">send an email</span>
                <span class="row-detail contact-address"></span>
              </span>
              <svg class="row-chevron" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <button type="button" class="panel-row contact-copy">
              <span class="row-icon" style="--tile: #5e5ce6" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M9 9h10v11H9z M5 15V4h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              </span>
              <span class="row-text">
                <span class="row-title">copy address</span>
              </span>
              <span class="row-status" aria-live="polite"></span>
            </button>
          </div>
        </div>

        <div class="panel-group contact-social-group" hidden>
          <h2 class="panel-label">socials</h2>
          <div class="panel contact-socials"></div>
        </div>
      </div>
    </section>
  </main>

  <dialog class="art-viewer" aria-label="Artwork viewer">
    <button type="button" class="viewer-button viewer-close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="viewer-button viewer-prev" aria-label="Previous artwork">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <figure class="viewer-figure">
      <img alt="">
      <figcaption></figcaption>
    </figure>
    <button type="button" class="viewer-button viewer-next" aria-label="Next artwork">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </dialog>

  <template id="beat-template">
    <article class="beat">
      <div class="beat-cover"><img alt=""></div>
      <div class="beat-body">
        <div class="beat-top">
          <button class="play-button" aria-label="Play">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <div class="beat-info">
            <h2 class="beat-title"></h2>
            <p class="beat-producer"></p>
            <p class="beat-meta"></p>
          </div>
          <a class="beat-download" download>download</a>
        </div>
        <canvas class="waveform" aria-label="Seek"></canvas>
        <div class="beat-time"><span class="time-current">0:00</span><span class="time-total"></span></div>
        <div class="beat-songs" hidden>
          <p class="beat-songs-label">songs</p>
          <ul></ul>
        </div>
      </div>
    </article>
  </template>

  <script src="/menu.js"></script>
  <script src="/fc-schema.js"></script>
  <script src="/site.js"></script>
</body>
</html>
