<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ch08</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="banner">
    <button class="menu-button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
      <span></span><span></span><span></span>
    </button>
    <a href="/#home" class="logo" aria-label="ch08 home">
      <span>ch</span>
      <span>08</span>
    </a>
  </header>

  <div class="menu-overlay" hidden></div>
  <nav id="menu" class="menu" aria-label="Main menu">
    <a href="/#home" class="menu-link">home</a>
    <a href="/#beats" class="menu-link">beats</a>
    <a href="/#ch08pedia" class="menu-link">ch08pedia</a>
    <a href="/#contact" class="menu-link">contact</a>
    <a href="/admin" class="menu-link">admin</a>
  </nav>

  <main>
    <section id="home" class="page">
      <div class="home">
        <p class="home-headline" hidden></p>
        <h1 class="home-big" hidden></h1>
        <img class="hero-gif" alt="" hidden>
        <p class="home-paragraph" hidden></p>
        <div class="link-list" hidden></div>
      </div>
    </section>

    <section id="beats" class="page" hidden>
      <div class="content-column">
        <h1 class="page-title">beats</h1>
        <div class="beats-toolbar" hidden>
          <label class="sort-control">
            <span>sort</span>
            <select id="beat-sort">
              <option value="newest">newest</option>
              <option value="oldest">oldest</option>
              <option value="title">title a–z</option>
              <option value="title-desc">title z–a</option>
              <option value="bpm">bpm low–high</option>
              <option value="bpm-desc">bpm high–low</option>
              <option value="length">length short–long</option>
              <option value="length-desc">length long–short</option>
            </select>
          </label>
          <div class="producer-pills" role="group" aria-label="Filter by producer"></div>
        </div>
        <div class="beat-list"></div>
        <p class="empty-note" hidden>no beats yet</p>
      </div>
    </section>

    <section id="ch08pedia" class="page pedia" hidden>
      <article class="pedia-article">
        <a href="/#home" class="pedia-brand">ch08pedia</a>
        <h1 class="pedia-title"></h1>
        <aside class="pedia-infobox" hidden>
          <p class="pedia-infobox-title"></p>
          <figure class="pedia-flag" hidden>
            <img alt="">
          </figure>
          <div class="pedia-nav-row" hidden>
            <span class="pedia-nav-prev"></span>
            <span class="pedia-nav-date"></span>
            <span class="pedia-nav-next"></span>
          </div>
          <dl class="pedia-facts"></dl>
          <div class="pedia-matchup" hidden>
            <div class="pedia-portraits">
              <span></span>
              <div class="pedia-portrait left"><img alt="" hidden></div>
              <div class="pedia-portrait right"><img alt="" hidden></div>
            </div>
            <table><tbody></tbody></table>
          </div>
          <figure class="pedia-map" hidden>
            <img alt="">
            <figcaption></figcaption>
          </figure>
          <dl class="pedia-closing"></dl>
        </aside>
        <div class="pedia-intro"></div>
        <nav class="pedia-contents" aria-label="Contents" hidden>
          <div class="pedia-contents-header">
            <span>Contents</span>
            <button type="button" class="pedia-contents-toggle">hide</button>
          </div>
          <ol></ol>
        </nav>
        <div class="pedia-sections"></div>
        <p class="pedia-note">ch08pedia is an independent page and is not part of or affiliated with Wikipedia.</p>
      </article>
    </section>

    <section id="contact" class="page" hidden>
      <div class="content-column contact">
        <h1 class="page-title">contact</h1>
        <p class="contact-paragraph" hidden></p>
        <a class="contact-email" hidden></a>
        <div class="link-list" hidden></div>
      </div>
    </section>
  </main>

  <template id="beat-template">
    <article class="beat">
      <div class="beat-cover"><img alt=""></div>
      <div class="beat-body">
        <div class="beat-top">
          <button class="play-button" aria-label="Play">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <div class="beat-info">
            <h2 class="beat-title"></h2>
            <p class="beat-producer"></p>
            <p class="beat-meta"></p>
          </div>
          <a class="beat-download" download>download</a>
        </div>
        <canvas class="waveform" aria-label="Seek"></canvas>
        <div class="beat-time"><span class="time-current">0:00</span><span class="time-total"></span></div>
        <div class="beat-songs" hidden>
          <p class="beat-songs-label">songs</p>
          <ul></ul>
        </div>
      </div>
    </article>
  </template>

  <script src="/menu.js"></script>
  <script src="/site.js"></script>
</body>
</html>
