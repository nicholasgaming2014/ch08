<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ch08</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="banner">
    <a href="#home" class="logo" aria-label="ch08 home">
      <span>ch</span>
      <span>08</span>
    </a>
    <nav class="tabs">
      <a href="#home" class="tab">Home</a>
      <a href="#contact" class="tab">Contact</a>
    </nav>
  </header>

  <main>
    <section id="home" class="page"></section>
    <section id="contact" class="page"></section>
  </main>

  <script>
    const tabs = document.querySelectorAll('.tab');
    const pages = document.querySelectorAll('.page');

    function show() {
      const id = (location.hash || '#home').slice(1);
      pages.forEach(p => p.hidden = p.id !== id);
      tabs.forEach(t => t.classList.toggle('active', t.hash === '#' + id));
    }

    window.addEventListener('hashchange', show);
    show();
  </script>
</body>
</html>
